[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quantumshield-fl"
version = "1.0.0"
description = "Quantum-Secured Federated Learning with Variational Quantum Circuits and QKD"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "QuantumShield-FL Research Team" }
]
keywords = [
    "quantum computing",
    "quantum machine learning",
    "federated learning",
    "quantum key distribution",
    "variational quantum circuits",
    "privacy preserving ML",
    "QKD",
    "VQC",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "rich>=13.6.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "websockets>=11.0.0",
    "aiofiles>=23.2.0",
    "loguru>=0.7.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "hypothesis>=6.87.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "plotly>=5.17.0",
]
pennylane = [
    "pennylane>=0.33.0",
    "pennylane-lightning>=0.33.0",
]
qiskit = [
    "qiskit>=0.44.0",
    "qiskit-aer>=0.13.0",
    "qiskit-machine-learning>=0.7.0",
]
all = [
    "quantumshield-fl[dev,notebooks,pennylane]",
]

[project.scripts]
qsfl = "src.cli:main"
qsfl-server = "src.api.app:start_server"

[project.urls]
Homepage = "https://github.com/your-username/quantumshield-fl"
Documentation = "https://quantumshield-fl.readthedocs.io"
Repository = "https://github.com/your-username/quantumshield-fl"
"Bug Tracker" = "https://github.com/your-username/quantumshield-fl/issues"
"Research Paper" = "https://arxiv.org/abs/xxxx.xxxxx"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401", "E501"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "-v",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]
